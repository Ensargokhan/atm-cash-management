services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: atmcash-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Atm_Cash_Dev_2026!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atmcash-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db,1433;Database=AtmCash;User Id=sa;Password=${SA_PASSWORD:-Atm_Cash_Dev_2026!};TrustServerCertificate=True;Encrypt=False"
      CardHashing__Pepper: ${CARD_HASH_PEPPER:-docker-compose-demo-pepper-change-me-0123456789}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  mssql-data:
